name: Vérifier la fiche

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 scripts/verifier.py
      - run: python3 scripts/generer_fiche.py --check
